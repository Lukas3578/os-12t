# VortexOS OTA configuration for Xiaomi 12T (plato)
# This file is installed to /etc/vortexos/ota.conf in the target image.

REPOSITORY="Lukas3578/os-12t"
CHANNEL="stable"
CHANNEL_URL="https://raw.githubusercontent.com/Lukas3578/os-12t/main/ota/channels/stable.json"
DEVICE="plato"
CURRENT_VERSION="0.1.0"
POLL_INTERVAL_HOURS="12"
MAX_ASSET_BYTES="2147483648"

# The automatic agent may check and download a valid update. It must not apply it.
AUTO_DOWNLOAD="1"
REQUIRE_INTERACTIVE_CONFIRMATION="1"
